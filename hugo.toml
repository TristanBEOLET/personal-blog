baseURL = "https://blog.tbeolet.com/"
locale = "en-us"
title = "Tristan Beolet"
theme = "PaperMod"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  math = true

  [params.assets]
    favicon = "/favicon.svg"

  [params.homeInfoParams]
    Title = "Write-ups of things I build, break and fix"
    Content = "AI, robotics, reinforcement learning and homelabbing."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/TristanBEOLET"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/tristan-beolet"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Series"
    url = "/series/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    identifier = "search"
    name = "Search"
    pageRef = "/search"
    weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
